# 在 Windows 上构建绿色版桌面端，并把产物作为 Release 附件发布。
#
# 用法：
#   - 推到 main          → 构建一次，产物上传为 Artifact（用来验证没打包坏）
#   - 打 tag 推送（v0.1.0）→ 构建并创建 Release，附件是 zip
#   - 或在 Actions 页面手动触发 → 只上传 Artifact
#
# 说明：产物约 390 MB（其中 360 MB 是 Electron 运行时 + 20 MB 是随包分发的 pnpm），
# 远超 GitHub 单文件 100 MB 的限制，所以只能走 Release 附件，不能进仓库。
name: build-desktop

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖（含 Electron 运行时）
        run: npm ci

      # 把环境事实写进 Job Summary；同时发一条 notice annotation ——
      # annotation 可以通过 GitHub API 读取，方便在没有仓库权限的环境里排查。
      - name: 环境自检
        shell: pwsh
        run: |
          $lines = @(
            "node          $(node -v)",
            "npm           $(npm -v)",
            "cwd           $((Get-Location).Path)",
            "electron dist $((Test-Path node_modules/electron/dist))",
            "electron.exe  $((Test-Path node_modules/electron/dist/electron.exe))",
            "pnpm          $((Test-Path node_modules/pnpm))",
            "resedit       $((Test-Path node_modules/resedit))"
          )
          (@("### 构建环境", "", '```text') + $lines + @('```', "")) |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $lines | Write-Host
          $escaped = ($lines | ForEach-Object { $_.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A") }) -join "%0A"
          Write-Host "::notice title=构建环境::$escaped"

      # 失败时把输出同时写进 Job Summary 和 error annotation：
      # Summary 给人看，annotation 给 API 读（Actions 原始日志需要仓库管理员权限）。
      - name: 打包绿色版
        shell: pwsh
        run: |
          npm run dist 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $head = Get-Content build.log -TotalCount 20
            $tail = Get-Content build.log -Tail 40
            (@("### 打包失败：build-app.mjs 输出", "", '```text') + $head + @("", "……（中间省略）……", "") + $tail + @('```', "")) |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $escape = { param($l) $l.Replace("%", "%25").Replace("`r", "%0D") }
            Write-Host ("::error title=打包失败-开头20行::" + (($head | ForEach-Object { & $escape $_ }) -join "%0A"))
            Write-Host ("::error title=打包失败-结尾40行::" + (($tail | ForEach-Object { & $escape $_ }) -join "%0A"))
            exit 1
          }
          "打包完成 ✅" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: 压缩产物
        shell: pwsh
        run: |
          $name = "DSH-Desktop-win32-x64"
          Compress-Archive -Path "dist/DSH Desktop" -DestinationPath "$name.zip" -CompressionLevel Optimal
          Get-Item "$name.zip" | Select-Object Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Desktop-win32-x64
          path: DSH-Desktop-win32-x64.zip
          retention-days: 7

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DSH-Desktop-win32-x64.zip
          generate_release_notes: true
          body: |
            下载 `DSH-Desktop-win32-x64.zip`，解压后双击 `DSH Desktop.exe` 即可。

            前提：本机需要先装好 Node.js 与 DeepSeek Harness：

            ```powershell
            npm i -g @deepseek-ai/dsh
            ```
